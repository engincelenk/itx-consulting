name: Deploy contact.php (all-inkl)

# Lädt NUR server/webhosting/contact.php als <Zielordner>/contact.php hoch.
# contact.secret.php auf dem Server wird nie angefasst (kein Mirror, kein Löschen).
on:
  push:
    branches: [main]
    paths:
      - server/webhosting/contact.php
      - .github/workflows/deploy-contact.yml
  workflow_dispatch:

concurrency:
  group: deploy-contact
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP-Syntax prüfen
        run: php -l server/webhosting/contact.php

      - name: Per FTPS hochladen
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          for v in FTP_HOST FTP_USER FTP_PASSWORD FTP_REMOTE_DIR; do
            [ -n "${!v}" ] || { echo "::error::Secret für $v fehlt"; exit 1; }
          done
          dir="${FTP_REMOTE_DIR#/}"; dir="${dir%/}"
          url="ftp://${FTP_HOST}/${dir:+$dir/}contact.php"
          # Explizites FTPS (TLS erzwungen, Zertifikat wird geprüft), nur diese eine Datei
          printf 'user = "%s:%s"\n' "$FTP_USER" "$FTP_PASSWORD" > "$RUNNER_TEMP/curlrc"
          curl --fail --show-error --silent --ssl-reqd --tlsv1.2 \
            --config "$RUNNER_TEMP/curlrc" \
            --upload-file server/webhosting/contact.php "$url"
          rm -f "$RUNNER_TEMP/curlrc"
          echo "contact.php hochgeladen."
