name: Gold-Radar Update

# Auslöser:
#  1. Cloudflare-Worker "gold-radar-wecker" (siehe projects/gold-radar/worker/): startet 5-mal am Tag (6, 10, 14, 18, 22 Uhr UTC) auf die Minute genau per workflow_dispatch (source=cloudflare)
#  2. Reserve-Zeitplan von GitHub (Best Effort, oft verspätet), je 40 Minuten nach dem Wecker. Läuft nur, wenn der Stand älter als 60 Minuten ist
#  3. Manuell ("Run workflow") und nach Code-Änderungen (Push)
on:
  # Bis zur Umschaltung aus, solange das alte Repo gold-radar noch läuft:
  # schedule:
  #   - cron: "40 6,10,14,18,22 * * *"   # 40 Min. nach dem Wecker; nur wirksam, wenn dieser ausgefallen ist
  workflow_dispatch:
    inputs:
      source:
        description: "Auslöser: manual oder cloudflare (der Wecker setzt cloudflare)"
        default: manual
  push:
    branches: [main]
    paths: ["projects/gold-radar/scripts/**", "projects/gold-radar/requirements.txt", ".github/workflows/gold-radar.yml"]

permissions:
  contents: write

concurrency:
  group: gold-radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # "true" bei automatischen Läufen (Wecker oder Zeitplan): Push-Nachricht und Tages-Snapshot nur um 22 Uhr UTC
      AUTO: ${{ github.event_name == 'schedule' || github.event.inputs.source == 'cloudflare' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # volle Historie: der Tages-Snapshot prüft, wann data.json zuletzt in main committet wurde
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/gold-radar/requirements.txt
      - run: pip install -r projects/gold-radar/requirements.txt
      - name: Tests (Nachrichten-Regeln)
        run: python -m unittest discover -s projects/gold-radar/tests

      # Der aktuelle Stand liegt im Branch "gr-data" (wird bei jedem Lauf überschrieben, wächst also nicht).
      # Daraus kommen Signal-Verlauf, letzter gemeldeter Stand und Nachrichten-Fallback.
      - name: Letzten Stand laden
        run: |
          if git fetch origin gr-data && git show FETCH_HEAD:data.json > /tmp/prev.json; then
            mv /tmp/prev.json public/gr/data.json
            # Rückblick (backtest.json) wird nur einmal täglich neu gerechnet und muss zwischen den Läufen erhalten bleiben
            if git show FETCH_HEAD:backtest.json > /tmp/prev_bt.json 2>/dev/null; then mv /tmp/prev_bt.json public/gr/backtest.json; fi
          else
            echo "Noch kein gr-data-Branch, nutze public/gr/data.json aus main"
          fi

      - name: Reservelauf überspringen, wenn der Stand frisch ist
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          skip = False
          try:
              age = datetime.now(timezone.utc) - datetime.fromisoformat(json.load(open("public/gr/data.json", encoding="utf-8"))["updated"])
              skip = age.total_seconds() < 3600
              print(f"Stand ist {age.total_seconds() / 60:.0f} Min. alt -> " + ("überspringen" if skip else "aktualisieren"))
          except Exception as e:
              print(f"Alter nicht lesbar ({e}) -> aktualisieren")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Daten holen, Signal berechnen, Nachrichten auswerten, ggf. benachrichtigen
        if: steps.fresh.outputs.skip != 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_DAILY: ${{ vars.NOTIFY_DAILY }}
          GOLDPRICE_API_KEY: ${{ secrets.GOLDPRICE_API_KEY }}
        run: |
          # Push-Nachrichten nur im Tagesabschluss-Lauf (22 Uhr UTC) und bei manuellem/Code-Start
          if [ "$AUTO" != "true" ] || [ "$(date -u +%H)" = "22" ]; then NOTIFY="--notify"; fi
          python projects/gold-radar/scripts/update.py $NOTIFY

      - name: Aktuellen Stand im Branch "gr-data" veröffentlichen
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "gold-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          entries=$(printf '100644 blob %s\tdata.json\n' "$(git hash-object -w public/gr/data.json)")
          if [ -f public/gr/backtest.json ]; then
            entries=$(printf '%s\n100644 blob %s\tbacktest.json\n' "$entries" "$(git hash-object -w public/gr/backtest.json)")
          fi
          tree=$(printf '%s\n' "$entries" | git mktree)
          commit=$(git commit-tree "$tree" -m "Gold-Radar Daten $(date -u +%FT%H:%MZ)")
          git push --force origin "$commit:refs/heads/gr-data"

      # Einmal pro Tag (22 Uhr UTC) ein Snapshot in main: Rückfall für die Seite, falls der gr-data-Branch nicht erreichbar ist.
      - name: Tages-Snapshot in main committen
        if: steps.fresh.outputs.skip != 'true'
        run: |
          last=$(git log -1 --format=%ct -- public/gr/data.json)
          if [ "$AUTO" != "true" ] || { [ "$(date -u +%H)" = "22" ] && [ $(( $(date +%s) - last )) -gt 10800 ]; }; then
            git add public/gr/data.json
            if [ -f public/gr/backtest.json ]; then git add public/gr/backtest.json; fi
            git diff --staged --quiet || git commit -m "Gold-Radar: Update $(date -u +%F)"
            git pull --rebase
            git push
          fi
