name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # einmal am Tag, damit Änderungen aus den Projekt-Repos online gehen (sofort: Actions → Run workflow)
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # Build und Deploy getrennt (Standard-Vorlage von GitHub):
  # - der Deploy-Job startet erst, wenn das Artefakt vollständig hochgeladen ist
  # - "Re-run failed jobs" wiederholt nur den Deploy, ohne ein zweites Artefakt zu erzeugen
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Kleine Projekte mit eigenem Repo, erreichbar unter /<name>/.
      # Neues Projekt: hier einen checkout-Schritt und eine Zeile zum Kopieren ergänzen.
      - uses: actions/checkout@v4
        with:
          repository: engincelenk/gr
          path: ext/gr
      - uses: actions/checkout@v4
        with:
          repository: engincelenk/jms
          path: ext/jms
      - uses: actions/checkout@v4
        with:
          repository: engincelenk/oq
          path: ext/oq
      - name: Projekte in die Website kopieren
        run: |
          mkdir -p dist/gr dist/jms dist/oq
          cp -r ext/gr/docs/. dist/gr/
          cp -r ext/jms/index.html ext/jms/jms-assets dist/jms/
          cp ext/oq/index.html dist/oq/
          rm -f dist/gr/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
